; Supervisord config for the single-container SOCA deployment.
; Runs three long-lived processes:
;   - uvicorn     (FastAPI backend on :8000)
;   - next-server (Next.js standalone on :3000)
;   - nginx       (edge on :8080 — the only externally-exposed port)
;
; nginx routes /api/* to uvicorn and everything else to next.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:uvicorn]
command=uvicorn backend.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",SOCA_LOG_LEVEL="%(ENV_SOCA_LOG_LEVEL)s",GEMINI_API_KEY="%(ENV_GEMINI_API_KEY)s"
priority=10

[program:next]
command=node /app/frontend/server.js
directory=/app/frontend
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=HOSTNAME="127.0.0.1",PORT="3000",NODE_ENV="production",SOCA_BACKEND_URL="http://127.0.0.1:8000"
priority=20

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=30
